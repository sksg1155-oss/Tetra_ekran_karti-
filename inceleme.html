      <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0e15;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Fare Takip Eden Beyaz Işık Katmanı */
    .cursor-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 450px;
      height: 450px;
      border-radius: 70%;
      background: radial-gradient(
        circle, 
        rgba(255, 255, 255, 0.25) 0%, 
        rgba(255, 255, 255, 0.08) 45%, 
        rgba(255, 255, 255, 0) 70%
      );
      pointer-events: none;
      transform: translate(-50%, -50%);
      /* Yumuşak geçiş (smooth animation) efekti */
      transition: transform 0.18s ease-out, opacity 0.3s ease;
      z-index: 1;
      will-change: transform;
    }

    /* İçerik Kutusu */
    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      max-width: 500px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    p {
      color: #a0a5b5;
      line-height: 1.6;
    }
        </style>

<body>

  <!-- Yumuşak Işık Halesi -->
  <div class="cursor-glow" id="glow"></div>

  <!-- Örnek İçerik -->
  

  <script>
    const glow = document.getElementById('glow');
    let mouseX = 0, mouseY = 0;
    let glowX = 0, glowY = 0;

    // Farenin anlık konumunu al
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    // Lerp (Linear Interpolation) ile ultra yumuşak takip animasyonu
    function animate() {
      // 0.1 değeri yumuşaklığı belirler (daha küçük = daha süzülen/akıcı hareket)
      glowX += (mouseX - glowX) * 0.1;
      glowY += (mouseY - glowY) * 0.1;

      glow.style.transform = `translate(${glowX - 225}px, ${glowY - 225}px)`;

      requestAnimationFrame(animate);
    }

    animate();
  </script>
